name: DemoUI
options:
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  shared-design-system:
    url: https://github.com/LeePepe/shared-design-system.git
    revision: 30112ae881314a525f3ffcb3913a3b02b8d6cbe6
targets:
  DemoUI:
    type: application
    platform: iOS
    sources:
      - Sources/StrataShowcase
      - Sources/StrataShowcaseApp
    configFiles:
      Debug: ../config/Signing.local.xcconfig
      Release: ../config/Signing.local.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(DEMOUI_BUNDLE_ID)"
        DEVELOPMENT_TEAM: "$(DEMOUI_TEAM_ID)"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "6.0"
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: $(DEMOUI_PROFILE_SPECIFIER)
    dependencies:
      - package: shared-design-system
        product: Strata
      - package: shared-design-system
        product: DesignTokens
  DemoUIMac:
    type: application
    platform: macOS
    sources:
      - Sources/StrataShowcase
      - Sources/StrataShowcaseApp
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: LeePepe.DemoUI.mac
      SWIFT_VERSION: "6.0"
    dependencies:
      - package: shared-design-system
        product: Strata
      - package: shared-design-system
        product: DesignTokens
