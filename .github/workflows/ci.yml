name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: LeePepe/shared-ci/.github/workflows/quality.yml@fd8a187ef4872aa1aa69c4e9afec9782183cc02d
    with:
      runs-on: macos-15
      setup-command: ""
      changed-only: false
      verify-command: scripts/verify --all
      lint-command: ""
      build-command: ""
      test-command: ""
