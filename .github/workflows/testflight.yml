name: testflight

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '47 6,18 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Upload even when the release gate finds no app changes
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  release:
    if: >-
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') &&
      (github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, demoui-mac]
    steps:
      - name: Check out main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0

      - name: Decide whether to release
        id: gate
        env:
          FORCE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
        run: |
          set -euo pipefail
          args=(--check-contract --dry-run)
          if [ "$FORCE_RELEASE" = "true" ]; then
            args+=(--force)
          fi
          decision="$(python3 scripts/testflight-gate.py "${args[@]}")"
          printf '%s\n' "$decision"
          release="$(printf '%s\n' "$decision" | sed -n 's/^release=//p')"
          if [ "$release" != "true" ] && [ "$release" != "false" ]; then
            echo "invalid release decision" >&2
            exit 1
          fi
          printf 'release=%s\n' "$release" >> "$GITHUB_OUTPUT"

      - name: Verify App Store Connect credentials
        if: steps.gate.outputs.release == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          DEMOUI_BUNDLE_ID: ${{ vars.DEMOUI_BUNDLE_ID }}
          DEMOUI_TEAM_ID: ${{ vars.DEMOUI_TEAM_ID }}
        run: |
          set -euo pipefail
          [ -n "${ASC_KEY_ID:-}" ] || { echo "ASC_KEY_ID is required" >&2; exit 1; }
          [ -n "${ASC_ISSUER_ID:-}" ] || { echo "ASC_ISSUER_ID is required" >&2; exit 1; }
          [ -n "${ASC_KEY_P8_BASE64:-}" ] || { echo "ASC_KEY_P8_BASE64 is required" >&2; exit 1; }
          [ -n "${DEMOUI_BUNDLE_ID:-}" ] || { echo "DEMOUI_BUNDLE_ID is required" >&2; exit 1; }
          [ -n "${DEMOUI_TEAM_ID:-}" ] || { echo "DEMOUI_TEAM_ID is required" >&2; exit 1; }
          if [ -z "${KEYCHAIN_PASSWORD:-}" ] && ! security show-keychain-info "$HOME/Library/Keychains/login.keychain-db" >/dev/null 2>&1; then
            echo "KEYCHAIN_PASSWORD is required when the login keychain is locked" >&2
            exit 1
          fi

      - name: Ensure fastlane + xcodegen
        if: steps.gate.outputs.release == 'true'
        run: |
          set -euo pipefail
          brew list fastlane >/dev/null 2>&1 || brew install fastlane
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Unlock login keychain for codesign
        if: steps.gate.outputs.release == 'true'
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KC="$HOME/Library/Keychains/login.keychain-db"
          if [ -n "${KEYCHAIN_PASSWORD:-}" ]; then
            if ! security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KC" 2>/tmp/kc-unlock.err; then
              echo "::error::Failed to unlock login keychain — check KEYCHAIN_PASSWORD secret."
              cat /tmp/kc-unlock.err >&2 || true
              exit 1
            fi
            security set-keychain-settings "$KC"
            EXISTING=$(security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"$//')
            security list-keychains -d user -s $(printf '%s\n' "$KC" $EXISTING | awk '!seen[$0]++')
            security set-key-partition-list -S apple-tool:,apple:,codesign: \
              -s -k "$KEYCHAIN_PASSWORD" "$KC" >/dev/null 2>&1 || true
          elif ! security show-keychain-info "$KC" >/dev/null 2>&1; then
            echo "::error::Login keychain is locked and KEYCHAIN_PASSWORD secret is not set."
            exit 1
          fi

      - name: Build and upload beta
        if: steps.gate.outputs.release == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          DEMOUI_BUNDLE_ID: ${{ vars.DEMOUI_BUNDLE_ID }}
          DEMOUI_TEAM_ID: ${{ vars.DEMOUI_TEAM_ID }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "6"
        run: fastlane ios beta

      - name: Mark released revision
        if: steps.gate.outputs.release == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin "HEAD:refs/tags/testflight/last-released" --force
